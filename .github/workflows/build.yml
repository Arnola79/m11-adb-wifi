name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk M11-ADB-WiFi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: M11-ADB-WiFi
          path: M11-ADB-WiFi.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest M11-ADB-WiFi.apk \
            --title "M11 ADB Wi-Fi (build ${{ github.run_number }})" \
            --notes "Télécharge M11-ADB-WiFi.apk depuis le Pixel et installe-le."
